    - "શરીરને ઠંડુ રાખવા ગળા અને કપાળ પર ભીનો રૂમાલ મૂકો."
    - "વડીલોની દર 2 કલાકે સંભાળ લો. બાળકોને તડકામાં એકલા ન મૂકો."
    - "બેભાન થવા જેવી સ્થિતિમાં તાત્કાલિક 108 કે 112 એમ્બ્યુલન્સ બોલાવો."
