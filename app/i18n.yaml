  advice_low:
    - "Stay hydrated: Drink at least 2.5 to 3 liters of water throughout the day."
    - "Wear light-colored, loose cotton clothing and protect your head with a cap or scarf."
    - "Moderate outdoor physical activity between 12:00 PM and 4:00 PM."
  advice_moderate:
    - "Carry water bottles and ORS (oral rehydration salts) if outdoors."
    - "Take frequent 10-minute breaks in shaded or ventilated areas during peak afternoon hours."
    - "Check in on elderly relatives and young children to ensure adequate hydration."
  advice_high:
    - "Avoid strenuous outdoor labor between 11:30 AM and 4:30 PM."
    - "Seek immediate shelter in cool, shaded public areas or air-conditioned transit hubs."
    - "Keep indoor spaces shaded: close west-facing curtains and ensure cross-ventilation."
    - "Watch for heat exhaustion symptoms: excessive sweating, dizziness, rapid pulse, and nausea."
