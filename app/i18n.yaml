  emergency_call: "आपातकालीन एम्बुलेंस: 108 / 112 पर कॉल करें"
  advice_low:
    - "पर्याप्त पानी पिएं: दिन भर में कम से कम 2.5 से 3 लीटर पानी अवश्य पिएं।"
    - "हल्के रंग के, ढीले सूती कपड़े पहनें और सिर को टोपी या गमछे से ढकें।"
    - "दोपहर 12:00 से 4:00 बजे के बीच बाहरी गतिविधियों को सीमित करें।"
  advice_moderate:
    - "बाहर जाते समय पानी की बोतल और ओआरएस घोल साथ रखें।"
    - "दोपहर के समय काम के बीच में छायादार स्थानों पर 10 मिनट का विश्राम लें।"
    - "बुजुर्गों और छोटे बच्चों के स्वास्थ्य की नियमित निगरानी करें।"
  advice_high:
    - "दोपहर 11:30 से शाम 4:30 बजे तक सीधे धूप में भारी श्रम से बचें।"
    - "निकटतम सार्वजनिक शीत केंद्र या वातानुकूलित स्थान में शरण लें।"
    - "कमरों को ठंडा रखने के लिए खिड़कियों पर पर्दे लगाएं और हवादार रखें।"
    - "लू के लक्षणों (चक्कर आना, उल्टी, तेज धड़कन) पर तुरंत ध्यान दें।"
  advice_extreme:
    - "अति गंभीर चेतावनी: जानलेवा हीटस्ट्रोक (लू) का अत्यधिक खतरा।"
    - "तुरंत निकटतम शीत केंद्र या ठंडे कमरे में जाएं और अनावश्यक बाहर न निकलें।"
    - "गर्दन और माथे पर गीला कपड़ा रखें और खूब ओआरएस/नींबू पानी लें।"
    - "बुजुर्गों का हर 2 घंटे में हालचाल लें। बच्चों को धूप में न छोड़ें।"
    - "बेहोशी या तेज बुखार होने पर तुरंत 108 या 112 एम्बुलेंस को कॉल करें।"

