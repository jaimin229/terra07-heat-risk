    - "Keep wet towels on the neck and forehead if experiencing acute overheating."
    - "Check on vulnerable seniors every 2 hours. Do not leave anyone inside parked vehicles."
    - "In case of confusion, unconsciousness, or hot dry skin, call emergency services (112 / 108) immediately."

